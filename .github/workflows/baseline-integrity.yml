name: baseline-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-integrity:
    name: baseline-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar Python
        run: python3 --version
      - name: Integridad del catálogo y artefactos de gobierno
        run: python3 scripts/validate_baseline.py
      - name: Instalar validador de contrato (versión fijada)
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validar contrato PX-1.2 y casos adversariales
        run: python3 scripts/validate_preview_contract.py
      - name: Node.js version
        run: node --version
      - name: QA PX-R1.3 (selector + 31 casos adversariales)
        run: node analisis/validate-px-r13.mjs
      - name: QA PX-R2.1 (35 pruebas de fuentes y linaje)
        run: node analisis/validate-px-r21.mjs
      - name: QA PX-R2.2a · Taxonomía de 7 temas (54 invariantes)
        run: node analisis/validate-px-r22a.mjs
      - name: QA PX-R2.2b · Segmentos y comparabilidad (80 pruebas)
        run: node analisis/validate-px-r22b.mjs
