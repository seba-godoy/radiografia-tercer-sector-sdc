name: baseline-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-integrity:
    name: baseline-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar Python
        run: python3 --version
      - name: Integridad del catálogo y artefactos de gobierno
        run: python3 scripts/validate_baseline.py
